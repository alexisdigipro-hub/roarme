name: Roardino for iPhone

# Builds Roardino for iPhone from roardino-ios/ (a Capacitor shell that opens roardino.com). The Xcode project is made
# fresh here each time, nothing of it is kept in the repository. It lives in RoarMe's repository only because the
# App Store Connect key is in this repository's secrets; nothing of it touches RoarMe.
#  - A pull request that touches roardino-ios/ or this file, and Run workflow with "check": builds for the simulator
#    with no signing, to prove the shell still builds. Needs nothing from Apple.
#  - Run workflow with "testflight": registers the bundle id (com.themadlions.roardino), needs the app made once in
#    App Store Connect (Apps > + > New App), then builds for a real iPhone, signs it and sends it to App Store Connect,
#    where it shows under TestFlight after Apple's processing. Reads the repository secrets ASC_KEY_ID, ASC_ISSUER_ID,
#    ASC_KEY_P8 and APPLE_TEAM_ID (the same ones RoarMe uses).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: check (no signing) or testflight
        default: check
        type: choice
        options: [check, testflight]
  pull_request:
    branches: [main]
    paths: ['roardino-ios/**', '.github/workflows/roardino-ios.yml']

permissions:
  contents: read

concurrency:
  group: roardino-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ inputs.mode == 'testflight' && 'testflight' || 'check' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Make the Xcode project
        working-directory: roardino-ios
        run: |
          npm install --no-audit --no-fund
          # the page stretches past its ends and springs back, as an iPhone's own lists do (Alex, 15 Nov: "more elastic,
          # no click at the end"): Capacitor turns the web view's bounce off in its own source, which is built from here
          F=$(grep -rl "scrollView.bounces" node_modules/@capacitor/ios --include=*.swift || true)
          if [ -n "$F" ]; then perl -pi -e 's/(scrollView\.bounces\s*=\s*)false/${1}true/' $F; fi
          grep -rn "scrollView.bounces" node_modules/@capacitor/ios --include=*.swift || echo "::warning::Capacitor's bounce line was not found; the page will not spring"
          # past the page's ends the web view showed the shell's one fixed colour, light even on the dark theme (Alex,
          # 15 Nov: "it spills"). Capacitor paints the scroll view itself; with that line gone WebKit paints it in the
          # page's own background colour, which follows the theme
          G=$(grep -rl "scrollView.backgroundColor" node_modules/@capacitor/ios --include=*.swift || true)
          echo "before:"; grep -rn -B3 -A3 "scrollView.backgroundColor" node_modules/@capacitor/ios --include=*.swift || true
          if [ -n "$G" ]; then perl -ni -e 'print unless /scrollView\.backgroundColor\s*=/' $G; fi
          echo "after:"; grep -rn "backgroundColor" node_modules/@capacitor/ios/Capacitor/Capacitor/CAPBridgeViewController.swift || true
          npx cap add ios
          npx cap sync ios
          cat ios/App/App/capacitor.config.json
      - name: Permission texts, name and version
        working-directory: roardino-ios
        run: |
          P=ios/App/App/Info.plist
          set_key() { /usr/libexec/PlistBuddy -c "Delete :$1" "$P" 2>/dev/null || true; /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$P"; }
          set_key NSCameraUsageDescription "Roardino uses the camera for the photos, videos and stories you choose to post."
          set_key NSMicrophoneUsageDescription "Roardino uses the microphone when you record a video or a story, and for calls in the chat."
          set_key NSPhotoLibraryUsageDescription "Roardino opens your photos only to post the ones you choose."
          set_key NSPhotoLibraryAddUsageDescription "Roardino saves the photos and videos you choose to keep."
          V=$(node -p "require('./package.json').version")
          # only the standard encryption of HTTPS and the system: no "Missing Compliance" question in TestFlight
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$P"
          /usr/libexec/PlistBuddy -c "Print" "$P"
      - name: Icon
        working-directory: roardino-ios
        run: |
          # the App Store wants one 1024px picture with no see-through parts
          D=ios/App/App/Assets.xcassets/AppIcon.appiconset
          ls -la "$D"; cat "$D/Contents.json"
          sips -s format jpeg -s formatOptions 100 icon-1024.png --out /tmp/icon.jpg >/dev/null
          sips -s format png /tmp/icon.jpg --out "$D/AppIcon-512@2x.png" >/dev/null
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$D/AppIcon-512@2x.png"
      - name: Build for the simulator, unsigned
        if: inputs.mode != 'testflight'
        working-directory: roardino-ios/ios/App
        run: |
          xcodebuild -version
          W=App.xcworkspace; [ -d "$W" ] && T="-workspace $W" || T="-project App.xcodeproj"
          set -o pipefail
          xcodebuild $T -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -60
      - name: Apple's side (bundle id, the app in App Store Connect, old development certificates)
        if: inputs.mode == 'testflight'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::The repository secret $v is missing"; exit 1; }
          done
          K="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"; export K
          printf '%s\n' "$ASC_KEY_P8" > "$K"
          trap 'rm -f "$K"' EXIT
          ruby -ropenssl -rjson -rnet/http -rbase64 -e '
            key = OpenSSL::PKey::EC.new(File.read(ENV["K"]))
            b64 = ->(s) { Base64.urlsafe_encode64(s, padding: false) }
            now = Time.now.to_i
            data = b64.(JSON.dump({alg: "ES256", kid: ENV["ASC_KEY_ID"], typ: "JWT"})) + "." + b64.(JSON.dump({iss: ENV["ASC_ISSUER_ID"], iat: now, exp: now + 900, aud: "appstoreconnect-v1"}))
            asn = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new, data))
            sig = asn.value.map { |i| i.value.to_s(2).rjust(32, "\x00")[-32, 32] }.join
            jwt = data + "." + b64.(sig)
            http = Net::HTTP.new("api.appstoreconnect.apple.com", 443); http.use_ssl = true
            hd = {"Authorization" => "Bearer #{jwt}", "Content-Type" => "application/json"}
            bid = "com.themadlions.roardino"
            res = http.get("/v1/bundleIds?filter[identifier]=#{bid}&limit=5", hd)
            abort("bundleIds: #{res.code} #{res.body[0, 300]}") unless res.code == "200"
            found = (JSON.parse(res.body)["data"] || []).find { |b| b["attributes"]["identifier"] == bid }
            unless found
              res = http.post("/v1/bundleIds", JSON.dump({data: {type: "bundleIds", attributes: {identifier: bid, name: "Roardino", platform: "IOS"}}}), hd)
              abort("register bundle id: #{res.code} #{res.body[0, 400]}") unless res.code == "201"
              puts "Registered #{bid}"
            end
            res = http.get("/v1/apps?filter[bundleId]=#{bid}", hd)
            apps = res.code == "200" ? (JSON.parse(res.body)["data"] || []) : []
            if apps.empty?
              puts "::error::Roardino is not in App Store Connect yet. Make it once: Apps > + > New App, iOS, name Roardino, bundle ID #{bid}, SKU roardino. Then run this again."
              exit 1
            end
            puts "App Store Connect app: #{apps[0]["id"]}"
            # each fresh Mac makes a new development certificate and Apple allows only a few (as ios.yml, Alex 15 Nov)
            res = http.get("/v1/certificates?filter[certificateType]=DEVELOPMENT,IOS_DEVELOPMENT&limit=200", hd)
            (res.code == "200" ? (JSON.parse(res.body)["data"] || []) : []).each { |c| r = http.delete("/v1/certificates/#{c["id"]}", hd); puts "revoked #{c["attributes"]["name"]} (#{r.code})" }
          '
      - name: Sign and send to TestFlight
        if: inputs.mode == 'testflight'
        working-directory: roardino-ios/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          K="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$K"
          trap 'rm -f "$K"' EXIT
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$K" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          W=App.xcworkspace; [ -d "$W" ] && T=(-workspace "$W") || T=(-project App.xcodeproj)
          set -o pipefail
          xcodebuild "${T[@]}" -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Roardino.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${AUTH[@]}" archive 2>&1 | tail -80
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Roardino.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" 2>&1 | tail -60
          echo "Sent. Build ${{ github.run_number }} shows in App Store Connect > Roardino > TestFlight once Apple has processed it."
