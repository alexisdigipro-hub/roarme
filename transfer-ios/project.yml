# RoarTransfer for iPhone (Alex, 15 Nov 2026). XcodeGen makes RoarTransfer.xcodeproj from this file in CI
# (.github/workflows/transfer-ios.yml); the Xcode project itself is never kept in the repository.
name: RoarTransfer
options:
  bundleIdPrefix: com.themadlions
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  RoarTransfer:
    type: application
    platform: iOS
    sources: [RoarTransfer]
    scheme: {}
    entitlements:
      path: RoarTransfer/RoarTransfer.entitlements
      properties:
        com.apple.developer.associated-domains: [applinks:roartransfer.com, applinks:www.roartransfer.com]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.themadlions.roartransfer
        PRODUCT_NAME: RoarTransfer
        INFOPLIST_FILE: RoarTransfer/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: RoarTransfer/Info.plist
      properties:
        CFBundleDisplayName: RoarTransfer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBack
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts: [Jost.ttf]
        # what is downloaded also shows in Files > On My iPhone > RoarTransfer
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: RoarTransfer saves the videos and photos you download straight to your Photos.
        NSPhotoLibraryUsageDescription: RoarTransfer opens your photos only to send the ones you choose, in their original quality.
        CFBundleURLTypes:
          - CFBundleURLName: com.themadlions.roartransfer
            CFBundleURLSchemes: [roartransfer]
