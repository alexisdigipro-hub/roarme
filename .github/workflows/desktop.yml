name: RoarMe desktop apps

# Builds RoarMe for Mac (.dmg, Apple Silicon and Intel) and Windows (.exe) from desktop/ and puts them on a
# GitHub release, whose files are the download links. Run it from the Actions tab (Run workflow) or by
# pushing a tag desktop-v*. The website itself is not touched.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      # GitHub's Macs sometimes fail to make a .dmg ("hdiutil: resource busy"): try up to three times,
      # and on a real failure put the end of the log where it can be read (the job's annotations)
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          for i in 1 2 3; do
            if npm run dist:mac > build.log 2>&1; then cat build.log; exit 0; fi
            echo "attempt $i failed"; tail -40 build.log; hdiutil detach /Volumes/RoarMe -force || true; rm -rf out; sleep 10
          done
          echo "::error title=Mac build::$(tail -25 build.log | tr '\n' ' ' | cut -c1-3500)"
          exit 1
      - if: runner.os == 'Windows'
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: roar-${{ runner.os }}
          path: |
            desktop/out/*.dmg
            desktop/out/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # the version goes into the release's name, so the app can tell an older install that a newer one is out
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            package.json
            desktop/package.json
            src/changes.js
          sparse-checkout-cone-mode: false
      - id: v
        run: echo "version=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      # what this version brings, in short bullets, from src/changes.js (the same lines the app shows)
      - id: notes
        run: |
          {
            echo 'text<<NOTES_END'
            node --input-type=module -e "import('./src/changes.js').then((m) => console.log(m.notesFor('${{ steps.v.outputs.version }}').map((x) => '- ' + x).join('\\n')))"
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      # the installers are named with their version and "beta" (RoarMe-1.4.7-beta-Mac-arm64.dmg, Alex 18 Oct); a copy under
      # the old plain name stays on the release, so links made before (releases/latest/download/RoarMe-Mac-arm64.dmg) keep working
      - run: |
          cd files
          for f in *; do
            case "$f" in
              *-Mac-arm64.dmg) [ "$f" = RoarMe-Mac-arm64.dmg ] || cp "$f" RoarMe-Mac-arm64.dmg ;;
              *-Mac-x64.dmg) [ "$f" = RoarMe-Mac-x64.dmg ] || cp "$f" RoarMe-Mac-x64.dmg ;;
              *-Windows-Setup.exe) [ "$f" = RoarMe-Windows-Setup.exe ] || cp "$f" RoarMe-Windows-Setup.exe ;;
            esac
          done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('desktop-build-{0}', github.run_number) }}
          name: RoarMe ${{ steps.v.outputs.version }} beta · ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          make_latest: true
          body: |
            RoarMe ${{ steps.v.outputs.version }} beta for Mac and Windows.

            ${{ steps.notes.outputs.text }}

            Mac with Apple Silicon (M1, M2, M3, M4): RoarMe-${{ steps.v.outputs.version }}-beta-Mac-arm64.dmg · Mac with Intel: RoarMe-${{ steps.v.outputs.version }}-beta-Mac-x64.dmg · Windows: RoarMe-${{ steps.v.outputs.version }}-beta-Windows-Setup.exe
          files: files/*
