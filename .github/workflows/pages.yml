name: Build and put RoarMe online

# Every push to main builds the app and puts it on GitHub Pages; a pull request only builds it,
# so a broken change is caught before it goes in.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      # the wordmark's typeface, Jost (as on themadlions.com), served from our own site so no font service sees the users
      - run: |
          mkdir -p public/fonts
          curl -fsSL "https://cdn.jsdelivr.net/npm/@fontsource-variable/jost@5/files/jost-latin-wght-normal.woff2" -o public/fonts/jost.woff2 \
            || curl -fsSL "https://cdn.jsdelivr.net/fontsource/fonts/jost:vf@latest/latin-wght-normal.woff2" -o public/fonts/jost.woff2 \
            || echo "Jost not fetched: the wordmark falls back to Futura"
          ls -la public/fonts
      - run: npm run build
      # the smoke test (Alex, 27 Nov): the built app walked on a phone and a computer with made-up data; any error stops
      # the change before it goes online (scripts/smoke.mjs)
      - run: npm install --no-save --no-audit --no-fund playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/smoke.mjs dist
      # roarme.app is RoarMe's page and the app lives at /app/ (Alex, 23 Nov): the build moves into dist/app; the page
      # (landing/), the service worker (one registration for the whole site, as before), the person links' 404 page,
      # Apple's association file and RoarTransfer stay at the root
      - run: |
          mkdir dist/app
          find dist -mindepth 1 -maxdepth 1 ! -name app ! -name .well-known ! -name 404.html -exec mv {} dist/app/ \;
          cp dist/app/sw.js dist/sw.js
          cp -r dist/app/transfer dist/transfer
          cp -r landing/. dist/
          ls -la dist dist/app | head -40
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
