<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light"><meta name="supported-color-schemes" content="light"><title>Confirm your email</title></head>
<body style="margin:0;padding:0;background:#f6ece4">
<div style="display:none;max-height:0;overflow:hidden">One tap and your RoarMe account is ready.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6ece4">
  <tr><td align="center" style="padding:40px 16px 32px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px">
      <tr><td align="center" style="padding:0 0 20px">
        <img src="https://themadlions.com/roarme/icon.png" width="64" height="64" alt="RoarMe" style="display:block;width:64px;height:64px;border:0;border-radius:16px">
      </td></tr>
      <tr><td style="background:#fffaf6;border:1px solid #f0e1d6;border-radius:28px;padding:36px 30px 30px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
        <div style="font-size:26px;line-height:1.25;font-weight:700;color:#1d1d24;letter-spacing:-.01em;padding:0 0 12px">Welcome to RoarMe</div>
        <div style="font-size:16px;line-height:1.55;color:#7a6f68;padding:0 0 26px">Tap the button to confirm this is your email. Then sign in and start chatting.</div>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="border-radius:999px;background:#f47318;background-image:linear-gradient(170deg,#ff9a3c,#f47318)">
          <a href="{{ .ConfirmationURL }}" style="display:block;padding:16px 24px;border-radius:999px;color:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:16px;font-weight:700;text-decoration:none;text-align:center">Confirm My Email</a>
        </td></tr></table>
        <div style="font-size:13px;line-height:1.5;color:#7a6f68;padding:24px 0 0;border-top:1px solid #efe2d8;margin-top:28px">If you did not create a RoarMe account, you can ignore this email.</div>
      </td></tr>
      <tr><td align="center" style="padding:22px 0 0;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:12px;line-height:1.6;color:#7a6f68">
        RoarMe by THE MAD LIONS · Athens
      </td></tr>
    </table>
  </td></tr>
</table>
</body></html>
