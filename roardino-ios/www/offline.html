<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Roardino</title>
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#eceef1;color:#1c2333;font:16px/1.45 -apple-system,system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  @media (prefers-color-scheme:dark){body{background:#15171b;color:#eef1f6}p{color:#9aa3b2}}
  h1{font-size:26px;letter-spacing:.02em;margin:0 0 6px;font-weight:300}h1 b{font-weight:800}h1 i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#d40000;vertical-align:top;margin-left:2px}
  p{margin:0 0 22px;color:#6b7385}
  button{font:600 14px/1 -apple-system,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:#d40000;border:0;border-radius:999px;padding:16px 34px;box-shadow:0 8px 22px rgba(212,0,0,.3)}
  button:active{transform:scale(.96)}
</style>
</head>
<body>
<div>
  <h1>R<b>O</b>A<b>RDINO</b><i></i></h1>
  <p>No connection. Check the internet and try again.</p>
  <button type="button" onclick="location.href='https://roardino.com/'">Try again</button>
</div>
</body>
</html>
