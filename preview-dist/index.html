<!doctype html>
<html lang="en" data-theme="ember">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#383d46" />
    <meta name="apple-mobile-web-app-title" content="RoarMe" />
    <!-- from the Home Screen: the app runs up under the clock and the battery, with no black band (Alex, 18 Oct) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>RoarMe</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- an app of its own on the Home Screen, which is what lets an iPhone receive notifications with RoarMe closed -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- type for the themes and for Settings > Appearance > Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- while RoarMe loads: the theme's grey and the small icon, from the very first moment (Alex, 19 Oct: no flashing,
         no black); React puts the same picture up (.boot) until it is ready, so nothing jumps -->
    <style>
      html, body { margin: 0; height: 100%; background: #22262c; }
      html[data-splash='light'], html[data-splash='light'] body { background: #eef2f7; }
      .splash { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, #2b3038 0%, #1c1f24 55%, #15171b 100%); }
      html[data-splash='light'] .splash { background: linear-gradient(180deg, #f4f7fb 0%, #eaf0f7 100%); }
      .splash img { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
    </style>
    <script>
      try { var p = JSON.parse(localStorage.getItem('roarme-prefs') || '{}'); if (p.mode === 'light' || (p.mode === 'auto' && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.dataset.splash = 'light' } catch (e) {}
    </script>
    <script type="module" crossorigin src="./assets/index-XpT_nvSX.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CK7oiaCZ.css">
  </head>
  <body>
    <div id="root"><div class="splash"><img src="./icon.svg" alt="" /></div></div>
  </body>
</html>
