name: RoarMe for iPhone

# Builds RoarMe for iPhone from mobile/ (the website inside a Capacitor shell). The Xcode project is made fresh here
# each time, nothing of it is kept in the repository.
#  - A pull request that touches mobile/ or this file, and Run workflow with "check": builds for the simulator with
#    no signing, to prove the shell still builds. Needs nothing from Apple.
#  - Run workflow with "testflight": builds for a real iPhone, signs it and sends it to App Store Connect, where it
#    shows under TestFlight after Apple's processing (10 to 30 minutes). Reads four repository secrets:
#    ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's whole text) and APPLE_TEAM_ID. The key needs the Admin
#    role, so Xcode can make the certificate and the profile in Apple's cloud by itself.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: check (no signing) or testflight
        default: check
        type: choice
        options: [check, testflight]
  pull_request:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ inputs.mode == 'testflight' && 'testflight' || 'check' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # the website, as it goes online
      - run: npm install --no-audit --no-fund
      - run: |
          mkdir -p public/fonts
          curl -fsSL "https://cdn.jsdelivr.net/npm/@fontsource-variable/jost@5/files/jost-latin-wght-normal.woff2" -o public/fonts/jost.woff2 || echo "Jost not fetched"
      - run: npm run build
      # the shell around it
      - name: Make the Xcode project
        working-directory: mobile
        run: |
          rm -rf www && cp -R ../dist www
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
      - name: Permission texts, name and version
        working-directory: mobile
        run: |
          P=ios/App/App/Info.plist
          set_key() { /usr/libexec/PlistBuddy -c "Delete :$1" "$P" 2>/dev/null || true; /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$P"; }
          set_key NSCameraUsageDescription "RoarMe uses the camera for video calls, video messages and photos you choose to send."
          set_key NSMicrophoneUsageDescription "RoarMe uses the microphone for calls and for voice and video messages."
          set_key NSPhotoLibraryAddUsageDescription "RoarMe saves the photos and videos you choose to keep."
          set_key NSLocationWhenInUseUsageDescription "RoarMe uses your location only when you send a place or share your live location in a chat."
          set_key NSPhotoLibraryUsageDescription "RoarMe opens your photos only to send the ones you choose."
          set_key NSContactsUsageDescription "RoarMe checks which of your contacts are on RoarMe. Their numbers are coded on your iPhone and never stored."
          set_key NSFaceIDUsageDescription "RoarMe uses Face ID to unlock the app when you turn on Unlock with Face ID."
          V=$(node -p "require('./package.json').version")
          # only the standard encryption of HTTPS and the system: every build reaches TestFlight without the "Missing Compliance" question (Alex, 15 Nov)
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$P"
          /usr/libexec/PlistBuddy -c "Print" "$P"
      - name: Apple's notifications
        working-directory: mobile/ios/App
        run: |
          # the push entitlement (automatic signing turns it into production for the App Store and adds Push to the App ID)
          cat > App/App.entitlements <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict><key>aps-environment</key><string>development</string></dict></plist>
          EOF
          P=App.xcodeproj/project.pbxproj
          grep -q CODE_SIGN_ENTITLEMENTS "$P" || perl -0pi -e 's#(INFOPLIST_FILE = App/Info.plist;)#$1\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = App/App.entitlements;#g' "$P"
          grep -c "CODE_SIGN_ENTITLEMENTS = App/App.entitlements" "$P"
          # the device's token handed to Capacitor's push plugin (its README's two AppDelegate methods)
          A=App/AppDelegate.swift
          grep -q capacitorDidRegisterForRemoteNotifications "$A" || perl -0pi -e 's#\}\s*\z#    func application(_ application: UIApplication, didRegisterForRemoteNotificationsWithDeviceToken deviceToken: Data) {\n        NotificationCenter.default.post(name: .capacitorDidRegisterForRemoteNotifications, object: deviceToken)\n    }\n\n    func application(_ application: UIApplication, didFailToRegisterForRemoteNotificationsWithError error: Error) {\n        NotificationCenter.default.post(name: .capacitorDidFailToRegisterForRemoteNotifications, object: error)\n    }\n}\n#' "$A"
          tail -12 "$A"
      - name: Icon
        working-directory: mobile
        run: |
          # the App Store wants one 1024px picture with no see-through parts
          D=ios/App/App/Assets.xcassets/AppIcon.appiconset
          ls -la "$D"; cat "$D/Contents.json"
          sips -z 1024 1024 ../public/icon-512.png --out /tmp/icon.png >/dev/null
          sips -s format jpeg -s formatOptions 100 /tmp/icon.png --out /tmp/icon.jpg >/dev/null
          sips -s format png /tmp/icon.jpg --out "$D/AppIcon-512@2x.png" >/dev/null
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$D/AppIcon-512@2x.png"
      - name: Notification sounds
        working-directory: mobile/ios/App
        run: |
          # RoarMe's own message sounds (mobile/sounds, made by scripts/push-sounds.mjs) in the app, where Apple looks
          # for a notification's sound; roar-push names the one each person picked
          cp ../../sounds/*.wav App/
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            p = Xcodeproj::Project.open("App.xcodeproj")
            t = p.targets.find { |x| x.name == "App" }
            g = p.main_group["App"]
            Dir["App/*.wav"].sort.each do |f|
              n = File.basename(f)
              next if g.files.any? { |x| x.path == n }
              t.resources_build_phase.add_file_reference(g.new_reference(n))
            end
            p.save'
          grep -c "\.wav in Resources" App.xcodeproj/project.pbxproj
      - name: Privacy manifest
        working-directory: mobile/ios/App
        run: |
          # Apple asks every app for a privacy manifest: no tracking, and why the app itself touches the two "required
          # reason" APIs a web view app uses (its own settings, its own files' dates). What RoarMe collects is declared
          # in App Store Connect and in the Privacy Policy.
          cat > App/PrivacyInfo.xcprivacy <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>NSPrivacyTracking</key><false/>
            <key>NSPrivacyTrackingDomains</key><array/>
            <key>NSPrivacyCollectedDataTypes</key><array/>
            <key>NSPrivacyAccessedAPITypes</key><array>
              <dict><key>NSPrivacyAccessedAPIType</key><string>NSPrivacyAccessedAPICategoryUserDefaults</string>
                <key>NSPrivacyAccessedAPITypeReasons</key><array><string>CA92.1</string></array></dict>
              <dict><key>NSPrivacyAccessedAPIType</key><string>NSPrivacyAccessedAPICategoryFileTimestamp</string>
                <key>NSPrivacyAccessedAPITypeReasons</key><array><string>C617.1</string></array></dict>
            </array>
          </dict></plist>
          EOF
          plutil -lint App/PrivacyInfo.xcprivacy
          gem list -i xcodeproj >/dev/null || sudo gem install xcodeproj --no-document
          ruby -e '
            require "xcodeproj"
            p = Xcodeproj::Project.open("App.xcodeproj")
            t = p.targets.find { |x| x.name == "App" }
            g = p.main_group["App"]
            n = "PrivacyInfo.xcprivacy"
            t.resources_build_phase.add_file_reference(g.new_reference(n)) unless g.files.any? { |x| x.path == n }
            p.save'
          grep -c "PrivacyInfo.xcprivacy in Resources" App.xcodeproj/project.pbxproj
      - name: Build for the simulator, unsigned
        if: inputs.mode != 'testflight'
        working-directory: mobile/ios/App
        run: |
          xcodebuild -version
          W=App.xcworkspace; [ -d "$W" ] && T="-workspace $W" || T="-project App.xcodeproj"
          set -o pipefail
          xcodebuild $T -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -60
      - name: Sign and send to TestFlight
        if: inputs.mode == 'testflight'
        working-directory: mobile/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::The repository secret $v is missing"; exit 1; }
          done
          K="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"; export K
          printf '%s\n' "$ASC_KEY_P8" > "$K"
          trap 'rm -f "$K"' EXIT
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$K" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Every fresh Mac makes a new Apple Development certificate and Apple allows only a few (build 41 stopped on
          # "maximum number of certificates", 15 Nov). Alex agreed (15 Nov, "way 2") that each TestFlight run revokes the
          # old development ones first, through the same API key. Distribution certificates are never touched.
          ruby -ropenssl -rjson -rnet/http -rbase64 -e '
            key = OpenSSL::PKey::EC.new(File.read(ENV["K"]))
            b64 = ->(s) { Base64.urlsafe_encode64(s, padding: false) }
            now = Time.now.to_i
            data = b64.(JSON.dump({alg: "ES256", kid: ENV["ASC_KEY_ID"], typ: "JWT"})) + "." + b64.(JSON.dump({iss: ENV["ASC_ISSUER_ID"], iat: now, exp: now + 600, aud: "appstoreconnect-v1"}))
            asn = OpenSSL::ASN1.decode(key.sign(OpenSSL::Digest::SHA256.new, data))
            sig = asn.value.map { |i| i.value.to_s(2).rjust(32, "\x00")[-32, 32] }.join
            jwt = data + "." + b64.(sig)
            http = Net::HTTP.new("api.appstoreconnect.apple.com", 443); http.use_ssl = true
            res = http.get("/v1/certificates?filter[certificateType]=DEVELOPMENT,IOS_DEVELOPMENT&limit=200", {"Authorization" => "Bearer #{jwt}"})
            abort("certificates: #{res.code} #{res.body[0, 200]}") unless res.code == "200"
            list = JSON.parse(res.body)["data"] || []
            puts "Development certificates found: #{list.size}"
            list.each { |c| r = http.delete("/v1/certificates/#{c["id"]}", {"Authorization" => "Bearer #{jwt}"}); puts "revoked #{c["attributes"]["name"]} #{c["attributes"]["certificateType"]} (#{r.code})" }
          ' || echo "::warning::Could not tidy the development certificates"
          W=App.xcworkspace; [ -d "$W" ] && T=(-workspace "$W") || T=(-project App.xcodeproj)
          set -o pipefail
          xcodebuild "${T[@]}" -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RoarMe.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${AUTH[@]}" archive 2>&1 | tail -80
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/RoarMe.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" 2>&1 | tail -60
          echo "Sent. Build ${{ github.run_number }} shows in App Store Connect > RoarMe > TestFlight once Apple has processed it."
