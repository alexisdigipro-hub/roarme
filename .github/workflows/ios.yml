name: RoarMe for iPhone

# Builds RoarMe for iPhone from mobile/ (the website inside a Capacitor shell). The Xcode project is made fresh here
# each time, nothing of it is kept in the repository.
#  - A pull request that touches mobile/ or this file, and Run workflow with "check": builds for the simulator with
#    no signing, to prove the shell still builds. Needs nothing from Apple.
#  - Run workflow with "testflight": builds for a real iPhone, signs it and sends it to App Store Connect, where it
#    shows under TestFlight after Apple's processing (10 to 30 minutes). Reads four repository secrets:
#    ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's whole text) and APPLE_TEAM_ID. The key needs the Admin
#    role, so Xcode can make the certificate and the profile in Apple's cloud by itself.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: check (no signing) or testflight
        default: check
        type: choice
        options: [check, testflight]
  pull_request:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/ios.yml']

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ inputs.mode == 'testflight' && 'testflight' || 'check' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # the website, as it goes online
      - run: npm install --no-audit --no-fund
      - run: |
          mkdir -p public/fonts
          curl -fsSL "https://cdn.jsdelivr.net/npm/@fontsource-variable/jost@5/files/jost-latin-wght-normal.woff2" -o public/fonts/jost.woff2 || echo "Jost not fetched"
      - run: npm run build
      # the shell around it
      - name: Make the Xcode project
        working-directory: mobile
        run: |
          rm -rf www && cp -R ../dist www
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
      - name: Permission texts, name and version
        working-directory: mobile
        run: |
          P=ios/App/App/Info.plist
          set_key() { /usr/libexec/PlistBuddy -c "Delete :$1" "$P" 2>/dev/null || true; /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$P"; }
          set_key NSCameraUsageDescription "RoarMe uses the camera for video calls, video messages and photos you choose to send."
          set_key NSMicrophoneUsageDescription "RoarMe uses the microphone for calls and for voice and video messages."
          set_key NSPhotoLibraryAddUsageDescription "RoarMe saves the photos and videos you choose to keep."
          V=$(node -p "require('./package.json').version")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$P"
          /usr/libexec/PlistBuddy -c "Print" "$P"
      - name: Icon
        working-directory: mobile
        run: |
          # the App Store wants one 1024px picture with no see-through parts
          D=ios/App/App/Assets.xcassets/AppIcon.appiconset
          ls -la "$D"; cat "$D/Contents.json"
          sips -z 1024 1024 ../public/icon-512.png --out /tmp/icon.png >/dev/null
          sips -s format jpeg -s formatOptions 100 /tmp/icon.png --out /tmp/icon.jpg >/dev/null
          sips -s format png /tmp/icon.jpg --out "$D/AppIcon-512@2x.png" >/dev/null
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$D/AppIcon-512@2x.png"
      - name: Build for the simulator, unsigned
        if: inputs.mode != 'testflight'
        working-directory: mobile/ios/App
        run: |
          xcodebuild -version
          W=App.xcworkspace; [ -d "$W" ] && T="-workspace $W" || T="-project App.xcodeproj"
          set -o pipefail
          xcodebuild $T -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -60
      - name: Sign and send to TestFlight
        if: inputs.mode == 'testflight'
        working-directory: mobile/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::The repository secret $v is missing"; exit 1; }
          done
          K="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$K"
          trap 'rm -f "$K"' EXIT
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$K" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          W=App.xcworkspace; [ -d "$W" ] && T=(-workspace "$W") || T=(-project App.xcodeproj)
          set -o pipefail
          xcodebuild "${T[@]}" -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RoarMe.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${AUTH[@]}" archive 2>&1 | tail -80
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/RoarMe.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" "${AUTH[@]}" 2>&1 | tail -60
          echo "Sent. Build ${{ github.run_number }} shows in App Store Connect > RoarMe > TestFlight once Apple has processed it."
