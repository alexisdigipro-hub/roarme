<!doctype html>
<html lang="en" data-theme="stone">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#383d46" />
    <meta name="apple-mobile-web-app-title" content="RoarMe" />
    <!-- from the Home Screen: the app runs up under the clock and the battery, with no black band (Alex, 18 Oct) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>RoarMe</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- an app of its own on the Home Screen, which is what lets an iPhone receive notifications with RoarMe closed -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- type for the themes and for Settings > Appearance > Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- the themes' fonts, without holding up the first paint (Alex, 21 Oct: RoarMe lighter) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
    <!-- while RoarMe loads: the theme's grey and the small icon, from the very first moment (Alex, 19 Oct: no flashing,
         no black); React puts the same picture up (.boot) until it is ready, so nothing jumps -->
    <style>
      html, body { margin: 0; height: 100%; background: #22262c; }
      html[data-splash='light'], html[data-splash='light'] body { background: #dcdcdd; }
      .splash { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, #2b3038 0%, #1c1f24 55%, #15171b 100%); }
      html[data-splash='light'] .splash { background: linear-gradient(180deg, #e2e2e3 0%, #d4d4d5 100%); }
      .splash img { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }
      /* inside the hub's RoarMe page: no splash of our own, see-through from the first frame, so the hub's backdrop
         shows and nothing white flashes while RoarMe loads (Alex, 1 Nov) */
      html[data-splash='hub'], html[data-splash='hub'] body, html[data-splash='hub'] .splash { background: transparent; }
      html[data-splash='hub'] .splash img { display: none; }
    </style>
    <script>
      try {
        var r = document.documentElement, inHub = window.parent !== window && (/[?&]embed=hub\b/.test(location.search) || sessionStorage.getItem('roarme-embed') === 'hub')
        if (inHub) { var l = JSON.parse(localStorage.getItem('roarme-hub-look') || 'null'); r.dataset.splash = 'hub'; r.style.colorScheme = l && l.light ? 'light' : 'dark' }
        else { var p = JSON.parse(localStorage.getItem('roarme-prefs') || '{}'); if (!p.mode || p.mode === 'light' || (p.mode === 'auto' && matchMedia('(prefers-color-scheme: light)').matches)) r.dataset.splash = 'light' }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><div class="splash"><img src="./icon.svg" alt="" /></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
