name: Build for the site's screens
# temporary (Alex, 25 Oct): the web build put on a branch of its own, so the screens of RoarMe's page on
# themadlions.com can be taken from the real app in the Stone theme. Removed with the branch afterwards.
on:
  push:
    branches: [claude/stone-screens-build]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund && npx vite build
      - name: Put dist on the branch claude/stone-screens-dist
        run: |
          cd dist
          git init -q -b claude/stone-screens-dist
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "RoarMe web build for the site's screens"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" claude/stone-screens-dist
